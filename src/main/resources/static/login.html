<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <title>OBU - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e3c72; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 97%; padding: 10px; background: #2a5298; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Oda Bultum University</h2>
    <p>Learning Management System</p>
    <input type="text" id="username" placeholder="Username (admin)">
    <input type="password" id="password" placeholder="Password (obu123)">
    <button onclick="login()">Seeni (Login)</button>
    <p id="msg" style="color:red;"></p>
</div>
<script>
    function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === 'admin' && p === 'obu123') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('msg').innerText = 'Username ykn Password dogoggora!';
        }
    }
</script>
</body>
</html>
